name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win

          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 你的项目是 pnpm workspace
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 构建 Svelte 前端
      - name: Build frontend
        run: pnpm run build:frontend

      # 把前端构建结果复制给 Electron
      - name: Copy frontend
        run: node scripts/copy-frontend.mjs

      # apps/electron/package.json 已经有：
      # build:win
      # build:mac
      #
      # 内部已经会调用 electron-builder
      - name: Build Electron
        run: npm --prefix apps/electron run build:${{ matrix.platform }}

      # 只提取真正需要发布的文件，
      # 不上传 win-unpacked / mac 等目录
      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-files

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const source = 'apps/electron/dist';
          const target = 'release-files';

          if (!fs.existsSync(source)) {
            console.error(`Build directory not found: ${source}`);
            process.exit(1);
          }

          const allowed = /\.(exe|dmg|zip|yml|yaml|blockmap)$/i;

          for (const file of fs.readdirSync(source)) {
            const src = path.join(source, file);

            if (
              fs.statSync(src).isFile() &&
              allowed.test(file)
            ) {
              console.log(`Collect: ${file}`);

              fs.copyFileSync(
                src,
                path.join(target, file)
              );
            }
          }

          const files = fs.readdirSync(target);

          if (files.length === 0) {
            console.error('No release files found');
            process.exit(1);
          }

          console.log('');
          console.log('Release files:');

          for (const file of files) {
            console.log(` - ${file}`);
          }
          EOF

      # 临时保存，用于最终统一创建 GitHub Release
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: veto-${{ matrix.platform }}
          path: release-files/*
          if-no-files-found: error

      # -------------------------
      # Cloudflare R2
      # -------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AWS CLI
        run: python -m pip install awscli

      - name: Upload to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}

        run: |
          echo "Uploading ${{ matrix.platform }} release to R2..."

          aws s3 cp \
            release-files/ \
            "s3://${R2_BUCKET}/releases/${GITHUB_REF_NAME}/" \
            --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

  # ==================================================
  # GitHub Release
  # 等 Windows + macOS 全部构建成功后执行
  # ==================================================

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows and macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: veto-*
          path: artifacts

      - name: Show release files
        run: |
          echo "Release files:"
          find artifacts -type f

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

        run: |
          # 创建 Release（如果还不存在）
          if ! gh release view "$TAG" \
            --repo "$REPO" \
            >/dev/null 2>&1
          then
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --generate-notes
          fi

          # 找出所有构建产物
          mapfile -d '' files < <(
            find artifacts \
              -type f \
              \( \
                -name "*.exe" \
                -o -name "*.dmg" \
                -o -name "*.zip" \
                -o -name "*.yml" \
                -o -name "*.yaml" \
                -o -name "*.blockmap" \
              \) \
              -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi

          echo "Uploading:"
          printf ' - %s\n' "${files[@]}"

          gh release upload "$TAG" \
            "${files[@]}" \
            --repo "$REPO" \
            --clobber